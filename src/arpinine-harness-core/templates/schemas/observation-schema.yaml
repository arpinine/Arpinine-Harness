type: object
required:
  - spec
  - runtime_class
  - scenario_id
  - timestamp
  - events
properties:
  spec:
    type: string
  run_id:
    type: string
  variant_id:
    type: string
  runtime_class:
    type: string
  runtime_implementation:
    type: string
  model_name:
    type: string
  model_version:
    type: string
  scenario_id:
    type: string
  timestamp:
    type: string
  started_at:
    type: string
  completed_at:
    type: string
  latency_ms:
    type: integer
  turn_count:
    type: integer
  tool_call_count:
    type: integer
  token_count_input:
    type: integer
  token_count_output:
    type: integer
  cost_usd:
    type: number
  error_count:
    type: integer
  dataset_version:
    type: string
  baseline_comparable:
    type: boolean
  conversation_ids:
    type: array
    items:
      type: string
  evidence_refs:
    type: array
    items:
      type: string
  decision_records:
    type: array
    items:
      type: object
      properties:
        decision_type:
          type: string
        decision_id:
          type: string
        confidence:
          type: number
        rationale:
          type: string
        evidence_refs:
          type: array
          items:
            type: string
        review_required:
          type: boolean
        review_outcome:
          type: string
  final_outcome:
    type: string
  events:
    type: array
    items:
      type: object
      required:
        - type
      properties:
        event_id:
          type: string
        parent_event_id:
          type: string
        type:
          type: string
          enum:
            - model_turn_started
            - model_turn_completed
            - tool_requested
            - tool_approved
            - tool_denied
            - tool_executed
            - memory_read
            - session_started
            - session_reset
            - session_ended
            - tool_call
            - permission_check
            - memory_write
            - failure
            - tool_registration
            - session_lifecycle
        tool:
          type: string
        tool_args:
          type: object
        timestamp:
          type: string
        duration_ms:
          type: integer
        turn_index:
          type: integer
        approved:
          type: boolean
        action:
          type: string
        decision:
          type: string
        reason:
          type: string
        result:
          type: string
        token_count_input:
          type: integer
        token_count_output:
          type: integer
        cost_usd:
          type: number
        attempt:
          type: integer
        correlation_id:
          type: string
        scope:
          type: string
        key:
          type: string
        input_ref:
          type: string
        output_ref:
          type: string
        category:
          type: string
        detail:
          type: string
