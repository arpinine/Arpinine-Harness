# ADR artifact schema
# Describes the expected frontmatter and section structure of an ADR-NNNN-*.md file.
# Used by adr-manager skill to validate completeness and linkage before acceptance.

$schema: "https://agentk.io/schemas/adr/v1"
type: object

required:
  - governs
  - status
  - date
  - covers

properties:
  governs:
    description: "Path to the spec this ADR governs. Format: specs/NNN-spec-name"
    type: string
    pattern: "^specs/\\d{3}-"

  supersedes:
    description: "ADR-NNNN this ADR replaces, or null."
    oneOf:
      - type: "null"
      - type: string
        pattern: "^ADR-\\d{4}$"

  status:
    description: "ADR lifecycle state."
    type: string
    enum: [Proposed, Accepted, Implemented, Superseded, Rejected]

  date:
    description: "Date the ADR was created or last transitioned. ISO 8601."
    type: string
    pattern: "^\\d{4}-\\d{2}-\\d{2}$"

  covers:
    description: "Stable keys for decisions or drift items this ADR documents."
    type: array
    minItems: 1
    items:
      type: string
      pattern: "^(decision|drift):[a-z0-9-]+:[a-z-]+:[a-zA-Z0-9_/.-]+$"

  source_rule:
    description: "rule-id that triggered the need for this ADR, if any."
    type: string
    pattern: "^[a-z]+-\\d{3}$"

# Required sections in the ADR body (checked by adr-manager as markdown headings):
sections:
  required:
    - "## Context"
    - "## Decision"
    - "## Consequences"
  recommended:
    - "## Alternatives Considered"
    - "## Status History"
